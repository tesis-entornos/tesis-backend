# Local development stack for the backend (not used for deployments).
services:

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # S3 emulator (in memory: data is lost when the container stops)
  s3:
    image: motoserver/moto:5.2.5
    ports:
      # Host port 5050: 5000 is often taken on macOS (AirPlay Receiver)
      - "5050:5000"

  # Creates the bucket; in AWS the bucket is provisioned by infrastructure code
  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        aws --endpoint-url http://s3:5000 s3api head-bucket --bucket ${S3_BUCKET:-tesis-files} 2>/dev/null && exit 0;
        aws --endpoint-url http://s3:5000 s3api create-bucket --bucket ${S3_BUCKET:-tesis-files} && exit 0;
        sleep 1; done; exit 1

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"

  # Runs migrations and creates initial data, then exits
  prestart:
    image: ${BACKEND_IMAGE:-tesis-backend:local}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: &backend-env
      FASTAPI_ENV: ${FASTAPI_ENV:-}
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-tesis}
      S3_BUCKET: ${S3_BUCKET:-tesis-files}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      AWS_REGION: us-east-1
      S3_ENDPOINT_URL: http://s3:5000
      S3_FORCE_PATH_STYLE: "true"
      # Fake credentials for the local emulator only
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SENTRY_DSN: ${SENTRY_DSN:-}

  backend:
    image: ${BACKEND_IMAGE:-tesis-backend:local}
    depends_on:
      prestart:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment: *backend-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
